name: 앱 깨워 두기
on:
  schedule:
    - cron: "17 */6 * * *"     # 6시간마다 (UTC)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python scripts/keepalive.py https://jeju-coast-map.streamlit.app/
